<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 餃木 GYOZA WOOD favicon:一顆鍋貼。
       造型刻意極簡,因為分頁圖示實際只有 16px —— 細節在那個尺寸只會糊成一團。 -->
  <rect width="32" height="32" rx="7" fill="#0a0f18"/>
  <!-- 餃身:半月形 -->
  <path d="M5 20c0-6 5-10 11-10s11 4 11 10z" fill="#f5e0b8"/>
  <!-- 底部煎面:焦香那一面 -->
  <path d="M5 20h22c0 2.6-4.9 4.5-11 4.5S5 22.6 5 20z" fill="#d98324"/>
  <!-- 三道摺痕 -->
  <g stroke="#c9a86a" stroke-width="1.4" stroke-linecap="round">
    <path d="M11 13.6v5"/>
    <path d="M16 12.2v6.4"/>
    <path d="M21 13.6v5"/>
  </g>
</svg>
