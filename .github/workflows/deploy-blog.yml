name: Deploy Astro Blog to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "blog-lab/**"
      - "web-lab/**"
      - "data-lab/**"
      - ".github/workflows/deploy-blog.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Astro blog
        working-directory: blog-lab
        run: |
          npm ci
          npm run build
      # 一個 repo 只有一個 Pages 網站:部落格放根目錄,web-lab 放在 /web-lab/ 子路徑。
      # 靜態版沒有 npm run dev 的 /api/* 端點,前端會退回 data-lab/ 的靜態範例。
      - name: Build web-lab
        working-directory: web-lab
        env:
          BASE_PATH: /${{ github.event.repository.name }}/web-lab/
        run: |
          npm ci
          npm run build
      - name: Combine sites
        run: cp -r web-lab/dist blog-lab/dist/web-lab
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blog-lab/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
